<div style="max-height: 100%; max-width: 100%;" 
	class="cmd #history# tooltips cmd-widget allowResize"
	data-type="info" 
	data-subtype="string"
	data-cmd_id="#id#"
	data-cmd_uid="#uid#"
	title="Capture prise #valueDate#">

	<div class="cmdName">#name#</div>
    <div class="directDisplay zoom" id="iconCmd#uid#">
      	<!-- Pas de src ici : la capture n'est pas servie a son chemin direct, elle est
      	     posee par le script ci-dessous. Voir gds3710UrlCapture(). -->
      	<img style="padding-top:5px; padding-bottom: 10px" class="img-responsive imgCmd#uid#" data-eqLogic_id="#id#"/>
    </div>


  	<script>

  	/* Une capture n'est PAS servie a son chemin direct : Jeedom refuse en 403 tout
  	   fichier sous plugins/<id>/data/. Le widget posait pourtant ce chemin en src et
  	   n'affichait donc jamais rien. On passe par downloadFile.php, qui exige une session
  	   ou une clef API — c'est deja par la que passent les vignettes de l'historique.

  	   calculPath() ne prefixe la racine de Jeedom que si le chemin ne commence pas par
  	   « / » ; un chemin absolu, lui, serait pris pour un chemin disque. On retire donc la
  	   barre initiale. */
  	if (typeof gds3710UrlCapture !== 'function') {
  		window.gds3710UrlCapture = function (chemin) {
  			if (!chemin) {
  				return '';
  			}
  			return 'plugins/gds3710/core/php/downloadFile.php?pathfile='
  			     + encodeURIComponent(String(chemin).replace(/^\//, ''));
  		};
  	}

  	// Allow embeding in virtual
  	var is_virtual#id# = false;
  	var ID_GDS#id# = '';

  	function findIdGDS(commandeID, url){
  		if(commandeID != ''){
	  		jeedom.cmd.byId({
	  			id:commandeID,
	  			success:
	  			function(cmd){
	  				if(cmd.eqType != 'gds3710'){
	  					is_virtual#id# = true;
	  				}
	  			}
	  		});
	  	}

	  	if(url != ''){
	  		var split_URL = url.split("/");
	  		ID_GDS#id# = split_URL[split_URL.length-2];
	  	}
  	}

  	findIdGDS('#id#','#state#');
  	// End Allow embeding in virtual

  	/* findIdGDS() recoit toujours le chemin brut : il en tire l'id de l'equipement en
  	   decoupant sur « / ». Seul le src passe par downloadFile.php. */
  	if('#state#' == ''){
  		$('.cmd[data-cmd_id=#id#]').hide();
  	} else {
  		$('.imgCmd#uid#').attr('src', gds3710UrlCapture('#state#'));
  		$('.cmd[data-cmd_id=#id#]').show();
  	}

    jeedom.cmd.update['#id#'] = function(_options){
    	// If src is empty then we hide the widget
    	if(_options.display_value == ''){
	  		$('.cmd[data-cmd_id=#id#]').hide();
	  	} else{
	  		$('.cmd[data-cmd_id=#id#]').show();
	  		$('.imgCmd#uid#').attr('src', gds3710UrlCapture(_options.display_value));
    		$('.cmd[data-cmd_id=#id#]').attr('title', 'Capture prise '+_options.valueDate);
	  	}
    	findIdGDS(#id#, _options.display_value);
    }

    $('.cmd[data-cmd_id=#id#]').off().on('click', function () {
        $('#md_modal').dialog({title: "Historique"});
        if(is_virtual#id#){
        	// Si nous sommes dans un virtuel alors on passe manuellement l'ID de la commande du GDS
	  		$('#md_modal').load('index.php?v=d&plugin=gds3710&modal=gds3710.history&eqlogic='+ID_GDS#id#).dialog('open');
	  	} else {
	  		$('#md_modal').load('index.php?v=d&plugin=gds3710&modal=gds3710.history&id=#id#').dialog('open');
	  	}
        
    });
	
	</script>

</div>
